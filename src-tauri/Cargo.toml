[package]
name = "fortuner-pos"
version = "0.0.0" # versi aplikasi diambil dari package.json (tauri.conf.json → "version")
description = "Fortuner POS — aplikasi desktop Front Office & Kasir"
edition = "2021"
publish = false

[lib]
name = "fortuner_pos_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
tauri-plugin-updater = "2.13"
tauri-plugin-process = "2.4"
tauri-plugin-autostart = "2.7"
tauri-plugin-single-instance = "2.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
printers = "=2.3.0"
machine-uid = "0.6"
gethostname = "1.1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
