# Membuat installer Windows (Fortuner-POS_x.y.z_x64-setup.exe) dan menerbitkannya di halaman Releases.
# Jalankan dari tab Actions → "Rilis aplikasi desktop" → Run workflow, setelah menaikkan "version" di package.json
# dan menambah catatannya di src/changelog.json (catatan itu muncul di dialog pembaruan aplikasi).
#
# Variabel/secret (Settings → Secrets and variables → Actions):
#   Variables: VITE_API_URL            alamat /exec Apps Script. Kosong = installer mode demo.
#              TAURI_UPDATER_PUBKEY    isi file kunci publik (fortuner.key.pub). Boleh juga disimpan sebagai Secret.
#   Secrets:   TAURI_SIGNING_PRIVATE_KEY           isi file kunci rahasia (fortuner.key)
#              TAURI_SIGNING_PRIVATE_KEY_PASSWORD  password kunci (boleh kosong)
name: Rilis aplikasi desktop
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: write
concurrency:
  group: release-desktop
  cancel-in-progress: false
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: npm ci
      - name: Siapkan konfigurasi pembaruan otomatis
        id: cfg
        shell: bash
        env:
          # Kunci publik boleh disimpan di Variables ATAU Secrets dengan nama TAURI_UPDATER_PUBKEY.
          PUBKEY: ${{ vars.TAURI_UPDATER_PUBKEY || secrets.TAURI_UPDATER_PUBKEY }}
          PRIVKEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          REPO: ${{ github.repository }}
        run: |
          node -e '
            const fs = require("fs");
            const pub = (process.env.PUBKEY || "").trim();
            const priv = (process.env.PRIVKEY || "").trim();
            console.log("Kunci publik  (TAURI_UPDATER_PUBKEY):       " + (pub ? "ADA" : "TIDAK ADA"));
            console.log("Kunci rahasia (TAURI_SIGNING_PRIVATE_KEY):  " + (priv ? "ADA" : "TIDAK ADA"));
            if (!!pub !== !!priv) {
              console.error("::error::Kunci pembaruan hanya terisi sebagian. Isi keduanya (lihat README) atau kosongkan keduanya.");
              process.exit(1);
            }
            const on = !!pub;
            const cfg = on
              ? { plugins: { updater: { pubkey: pub, endpoints: [`https://github.com/${process.env.REPO}/releases/latest/download/latest.json`] } } }
              : { bundle: { createUpdaterArtifacts: false } };
            fs.writeFileSync("src-tauri/tauri.ci.json", JSON.stringify(cfg, null, 2));
            console.log(on ? "Pembaruan otomatis: AKTIF" : "::warning::Pembaruan otomatis TIDAK AKTIF (kunci belum diatur). PC yang memasang versi ini harus diperbarui manual.");
            // catatan pembaruan untuk versi ini (tampil di dialog pembaruan aplikasi)
            const ver = require("./package.json").version;
            const log = require("./src/changelog.json").find((c) => c.version === ver);
            const notes = log ? log.catatan.map((t) => "• " + t).join("\n") : "Perbaikan dan peningkatan.";
            fs.appendFileSync(process.env.GITHUB_OUTPUT, "notes<<EOF_NOTES\n" + notes + "\nEOF_NOTES\n");
          '
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_APP_NAME: ${{ vars.VITE_APP_NAME }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: Fortuner POS v__VERSION__
          releaseBody: ${{ steps.cfg.outputs.notes }}
          releaseDraft: false
          prerelease: false
          args: --config src-tauri/tauri.ci.json
